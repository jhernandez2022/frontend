<header class="navbar-v3">
  <div class="navbar-container">
    <div class="brand">
      <a routerLink="/catalogo">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">ClothLink</span>
      </a>
    </div>

    <nav class="nav-links">
      <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
      <a routerLink="/crear-prenda" routerLinkActive="active">Donar</a>
    </nav>

    <div class="user-profile">
      <div class="avatar-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <!-- Nombre dinámico del usuario que inició sesión -->
      <span class="user-name">{{ usuarioNombre }}</span>
      <span class="status-dot"></span>

      <!-- Botón de Cerrar Sesión funcional -->
      <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>
</header>
